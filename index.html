<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON STRIKE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 600, H = 800;
canvas.width = W; canvas.height = H;

// === WEB AUDIO ===
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, vol = 0.3) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sfxShoot() { playSound(880, 'square', 0.08, 0.15); }
function sfxExplode() { playSound(120, 'sawtooth', 0.3, 0.25); playSound(60, 'square', 0.4, 0.2); }
function sfxHit() { playSound(200, 'sawtooth', 0.2, 0.3); }
function sfxPowerup() { playSound(440, 'sine', 0.1, 0.2); setTimeout(() => playSound(660, 'sine', 0.1, 0.2), 100); setTimeout(() => playSound(880, 'sine', 0.15, 0.2), 200); }
function sfxWave() { playSound(330, 'triangle', 0.2, 0.2); setTimeout(() => playSound(440, 'triangle', 0.2, 0.2), 150); setTimeout(() => playSound(550, 'triangle', 0.3, 0.2), 300); }

// === GAME STATE ===
let state = 'title';
let score = 0, lives = 3, wave = 1;
let enemies = [], bullets = [], enemyBullets = [], particles = [], stars = [], powerups = [];
let combo = 1, comboTimer = 0, waveTransition = 0;
let waveEnemiesRemaining = 0, waveEnemiesSpawned = 0;
let spawnTimer = 0, spawnInterval = 60;
let kills = 0;
let bgPulse = 0;
let highScore = localStorage.getItem('neonStrikeHigh') || 0;

const player = { x: W/2, y: H-60, w: 40, h: 40, speed: 6, cooldown: 0, invincible: 0, shield: 0 };
const keys = {};

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  if (state === 'title' && e.key === ' ') { audioCtx.resume(); startGame(); }
  if ((state === 'gameover' || state === 'win') && e.key === ' ') { audioCtx.resume(); startGame(); }
});
document.addEventListener('keyup', e => keys[e.key] = false);

let touchX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state !== 'playing') { audioCtx.resume(); startGame(); return; }
  touchX = e.touches[0].clientX * (W / canvas.width);
});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (state === 'playing') touchX = e.touches[0].clientX * (W / canvas.width); });
canvas.addEventListener('touchend', e => { e.preventDefault(); touchX = null; });

function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, sp: Math.random()*1.5+0.5 });
}
initStars();

function startGame() {
  state = 'playing'; score = 0; lives = 3; wave = 1; kills = 0;
  enemies = []; bullets = []; enemyBullets = []; particles = []; powerups = [];
  combo = 1; comboTimer = 0; player.x = W/2; player.invincible = 0; player.shield = 0;
  setupWave();
}

function setupWave() {
  waveEnemiesRemaining = 5 + wave * 3;
  waveEnemiesSpawned = 0; spawnTimer = 0;
  spawnInterval = Math.max(20, 60 - wave * 4);
  waveTransition = 90; bgPulse = 1;
  sfxWave();
}

function spawnEnemy() {
  let type = 'basic';
  if (wave >= 3 && Math.random() < 0.3) type = 'fast';
  if (wave >= 5 && Math.random() < 0.2) type = 'tank';
  enemies.push({
    x: Math.random()*(W-60)+30, y: -30,
    w: type==='tank'?40:30, h: type==='tank'?40:30,
    type, hp: type==='tank'?3:1,
    speed: (type==='fast'?3:1.5) + wave*0.3,
    color: type==='fast'?'#ff00ff':type==='tank'?'#ff4444':'#00ffff',
    shootTimer: type==='tank' ? 60 : 120 + Math.random()*60
  });
  waveEnemiesSpawned++;
}

function shoot() {
  if (player.cooldown <= 0) {
    bullets.push({ x: player.x, y: player.y-20, vy: -10, w: 4, h: 14 });
    player.cooldown = 12;
    sfxShoot();
  }
}

function enemyShoot(e) {
  const angle = Math.atan2(player.y - e.y, player.x - e.x);
  enemyBullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(angle)*4, vy: Math.sin(angle)*4, w: 6, h: 6 });
}

function explode(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const a = (Math.PI*2/count)*i + Math.random()*0.5;
    const sp = Math.random()*4+2;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 30+Math.random()*20, maxLife: 50, color, size: Math.random()*4+2 });
  }
}

function spawnPowerup(x, y) {
  powerups.push({ x, y, vy: 1.5, w: 24, h: 24, type: 'shield' });
}

function update() {
  stars.forEach(s => { s.y += s.sp*(1+wave*0.1); if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
  if (bgPulse > 0) bgPulse -= 0.02;
  if (state !== 'playing') return;
  if (waveTransition > 0) { waveTransition--; return; }

  // Player
  if (keys['ArrowLeft']||keys['a']||keys['A']) player.x -= player.speed;
  if (keys['ArrowRight']||keys['d']||keys['D']) player.x += player.speed;
  if (touchX !== null) player.x += (touchX*(W/canvas.width) - player.x)*0.3;
  player.x = Math.max(20, Math.min(W-20, player.x));
  if (touchX !== null) shoot();
  else if (keys[' ']||keys['Spacebar']) shoot();
  if (player.cooldown > 0) player.cooldown--;
  if (player.invincible > 0) player.invincible--;
  if (player.shield > 0) player.shield--;
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) combo = 1; }

  // Spawn
  if (waveEnemiesSpawned < waveEnemiesRemaining) {
    spawnTimer++;
    if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnEnemy(); }
  }

  // Bullets
  bullets.forEach(b => b.y += b.vy);
  bullets = bullets.filter(b => b.y > -20);
  enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  enemyBullets = enemyBullets.filter(b => b.x > -20 && b.x < W+20 && b.y > -20 && b.y < H+20);

  // Enemies
  enemies.forEach(e => {
    e.y += e.speed;
    if (wave >= 4) {
      e.shootTimer--;
      if (e.shootTimer <= 0) { enemyShoot(e); e.shootTimer = 90 + Math.random()*60; }
    }
  });
  enemies = enemies.filter(e => e.y < H+40);

  // Bullet-enemy
  bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      if (Math.abs(b.x-e.x) < e.w/2+b.w/2 && Math.abs(b.y-e.y) < e.h/2+b.h/2) {
        e.hp--;
        if (bi < bullets.length) bullets.splice(bi, 1);
        if (e.hp <= 0) {
          explode(e.x, e.y, e.color);
          sfxExplode();
          score += (e.type==='tank'?30:e.type==='fast'?20:10)*combo;
          combo++; comboTimer = 60; kills++;
          if (kills % 5 === 0) spawnPowerup(e.x, e.y);
          enemies.splice(ei, 1);
        }
      }
    });
  });

  // Enemy bullet - player
  if (player.invincible <= 0) {
    enemyBullets.forEach((b, bi) => {
      if (Math.abs(b.x-player.x) < player.w/2 && Math.abs(b.y-player.y) < player.h/2) {
        if (player.shield > 0) {
          explode(b.x, b.y, '#00ff88', 6);
          enemyBullets.splice(bi, 1);
        } else {
          lives--; sfxHit();
          player.invincible = 90;
          explode(player.x, player.y, '#00ff88');
          combo = 1;
          enemyBullets.splice(bi, 1);
          if (lives <= 0) { state = 'gameover'; if (score>highScore){highScore=score;localStorage.setItem('neonStrikeHigh',highScore);} }
        }
      }
    });
  }

  // Enemy-player
  if (player.invincible <= 0) {
    enemies.forEach((e, ei) => {
      if (Math.abs(e.x-player.x) < e.w/2+player.w/2-10 && Math.abs(e.y-player.y) < e.h/2+player.h/2-10) {
        if (player.shield > 0) {
          explode(e.x, e.y, e.color); enemies.splice(ei, 1);
          score += 10; kills++;
        } else {
          lives--; sfxHit();
          player.invincible = 90;
          explode(player.x, player.y, '#00ff88');
          enemies.splice(ei, 1); combo = 1;
          if (lives <= 0) { state = 'gameover'; if (score>highScore){highScore=score;localStorage.setItem('neonStrikeHigh',highScore);} }
        }
      }
    });
  }

  // Powerups
  powerups.forEach((p, pi) => {
    p.y += p.vy;
    if (Math.abs(p.x-player.x) < 25 && Math.abs(p.y-player.y) < 25) {
      player.shield = 300; // 5 seconds
      sfxPowerup();
      powerups.splice(pi, 1);
    }
  });
  powerups = powerups.filter(p => p.y < H+20);

  // Wave complete
  if (waveEnemiesSpawned >= waveEnemiesRemaining && enemies.length === 0) {
    if (wave >= 10) { state = 'win'; if (score>highScore){highScore=score;localStorage.setItem('neonStrikeHigh',highScore);} }
    else { wave++; setupWave(); }
  }

  // Particles
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.97; p.vy*=0.97; });
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  // Background with pulse
  const pulse = bgPulse * 0.3;
  ctx.fillStyle = `rgb(${10+pulse*20}, ${10+pulse*10}, ${26+pulse*40})`;
  ctx.fillRect(0, 0, W, H);

  stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${s.s/3})`; ctx.fillRect(s.x, s.y, s.s, s.s); });

  if (state === 'title') {
    ctx.save(); ctx.textAlign = 'center';
    ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#00ffff'; ctx.font = 'bold 48px Courier New';
    ctx.fillText('NEON STRIKE', W/2, H/2-60);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#aaa'; ctx.font = '18px Courier New';
    ctx.fillText('Press SPACE or Tap to Start', W/2, H/2+20);
    ctx.fillStyle = '#666'; ctx.font = '14px Courier New';
    ctx.fillText('← → or A/D to move | SPACE to shoot', W/2, H/2+60);
    ctx.fillText('Mobile: Drag to move (auto-shoot)', W/2, H/2+85);
    if (highScore > 0) { ctx.fillStyle = '#ff00ff'; ctx.font = '16px Courier New'; ctx.fillText(`High Score: ${highScore}`, W/2, H/2+130); }
    ctx.restore(); return;
  }

  // Particles
  particles.forEach(p => { ctx.globalAlpha = p.life/p.maxLife; ctx.fillStyle = p.color; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); });
  ctx.globalAlpha = 1;

  // Powerups
  powerups.forEach(p => {
    ctx.save();
    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 15;
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('S', p.x, p.y+4);
    ctx.restore();
  });

  // Bullets
  ctx.save(); ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 8; ctx.fillStyle = '#ffff00';
  bullets.forEach(b => ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h));
  ctx.restore();

  // Enemy bullets
  ctx.save(); ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 8; ctx.fillStyle = '#ff4444';
  enemyBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.w/2, 0, Math.PI*2); ctx.fill(); });
  ctx.restore();

  // Enemies
  enemies.forEach(e => {
    ctx.save(); ctx.shadowColor = e.color; ctx.shadowBlur = 15; ctx.fillStyle = e.color;
    if (e.type === 'tank') {
      ctx.fillRect(e.x-e.w/2, e.y-e.h/2, e.w, e.h);
      ctx.fillStyle = '#fff'; ctx.font = '12px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(e.hp.toString(), e.x, e.y+4);
    } else if (e.type === 'fast') {
      ctx.beginPath(); ctx.moveTo(e.x, e.y+15); ctx.lineTo(e.x-15, e.y-15); ctx.lineTo(e.x+15, e.y-15); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(e.x, e.y, 15, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });

  // Player
  if (player.invincible <= 0 || Math.floor(player.invincible/5)%2===0) {
    ctx.save();
    if (player.shield > 0) {
      ctx.strokeStyle = `rgba(0,255,136,${0.5+Math.sin(Date.now()*0.01)*0.3})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(player.x, player.y, 28, 0, Math.PI*2); ctx.stroke();
    }
    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 20; ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y-20); ctx.lineTo(player.x-15, player.y+15); ctx.lineTo(player.x, player.y+8); ctx.lineTo(player.x+15, player.y+15);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6600'; ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(player.x, player.y+18, 5, 8+Math.random()*4, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // HUD
  ctx.save(); ctx.font = 'bold 18px Courier New';
  ctx.fillStyle = '#00ffcc'; ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 5; ctx.textAlign = 'left';
  ctx.fillText(`♥ × ${lives}`, 20, 30);
  if (player.shield > 0) { ctx.fillStyle = '#00ff88'; ctx.fillText(`🛡 ${Math.ceil(player.shield/60)}s`, 20, 55); }
  ctx.fillStyle = '#ffff00'; ctx.shadowColor = '#ffff00'; ctx.textAlign = 'right';
  ctx.fillText(`${score}`, W-20, 30);
  ctx.fillStyle = '#ff00ff'; ctx.shadowColor = '#ff00ff'; ctx.textAlign = 'center';
  ctx.fillText(`WAVE ${wave}/10`, W/2, 30);
  if (combo > 1) { ctx.fillStyle = '#ff8800'; ctx.shadowColor = '#ff8800'; ctx.fillText(`×${combo}`, W/2, 55); }
  ctx.restore();

  // Wave transition
  if (waveTransition > 0) {
    ctx.save(); ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(0,255,255,${waveTransition/90})`;
    ctx.font = 'bold 36px Courier New'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
    ctx.fillText(`WAVE ${wave}`, W/2, H/2);
    ctx.restore();
  }

  // Game Over
  if (state === 'gameover') {
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff0044'; ctx.font = 'bold 42px Courier New'; ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', W/2, H/2-40);
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = '20px Courier New';
    ctx.fillText(`Score: ${score}`, W/2, H/2+10);
    ctx.fillText(`High Score: ${highScore}`, W/2, H/2+40);
    ctx.fillStyle = '#00ffff'; ctx.font = '16px Courier New';
    ctx.fillText('Press SPACE or Tap to Restart', W/2, H/2+90);
    ctx.restore();
  }

  // Win
  if (state === 'win') {
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ff88'; ctx.font = 'bold 42px Courier New'; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20;
    ctx.fillText('YOU WIN!', W/2, H/2-40);
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = '20px Courier New';
    ctx.fillText(`Final Score: ${score}`, W/2, H/2+10);
    ctx.fillText(`High Score: ${highScore}`, W/2, H/2+40);
    ctx.fillStyle = '#00ffff'; ctx.font = '16px Courier New';
    ctx.fillText('Press SPACE or Tap to Play Again', W/2, H/2+90);
    ctx.restore();
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
